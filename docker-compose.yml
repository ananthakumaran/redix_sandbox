services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--save", "",
        "--appendonly", "no",
        "--aclfile", "/usr/local/etc/redis/users.acl"
      ]
    volumes:
      - ./test/support/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
